   box(.55,deckY,1.7,side*6.8,deckY/2,0,0x607e8f);
   for(let i=0;i<5;i++)box(.12,1.2,.12,side*(1.5+i*1.1),deckY+1.05,0,0xbad8e2);
  }
  box(span,.13,.16,0,deckY+1.65,0,0xd6e8e9);
 }else if(o.type==='gate'){
  let h=8,span=10;
  for(let side of [-1,1])box(.9,h,1.3,side*span*.5,h/2,0,0x8099a4);
  box(span+1,1.1,1.5,0,h,0,0xb4c9ce);
  for(let i=-4;i<=4;i++)box(.09,1.2,.1,i, h+.9,0,0xe5d4ad);
 }else if(o.type==='tower'){
  box(width*.72,height,depth*.72,0,height/2,0,0x6c899f);
  for(let j=0;j<4;j++)box(width*(1.2-j*.18),.32,depth*(1.2-j*.18),0,height*.25*(j+1),0,0xabc7c7);
  box(.18,2,.18,0,height+1,0,0xe9dba9);
 }else{
  box(width,height,depth,0,height/2,0,o.color);
  box(width+.2,.15,depth+.2,0,height+.07,0,0xb1cbd1);
  for(let yy=.7;yy<height-.3;yy+=.85)
   for(let xx=-width/2+.32;xx<width/2-.1;xx+=.48)
    box(.18,.27,.025,xx,yy,-depth/2-.018,0xc9e9ce);
 }
}
function collision3(o){
 // Every collision sample uses the same coordinates as the visible 3D mesh.
 // Wing cells have real X/Z coordinates; the central fuselage is deliberately narrow.
 const px=player.x*1.25, py=3.4-player.y*1.2, pz=4;
 const ox=o.x*1.35, oz=-o.z*2.7;
 const parts=[];
 const add=(cx,cy,cz,w,h,d,label)=>{
   parts.push({cx:ox+cx,cy,cz:oz+cz,w,h,d,label});
 };
 const width=o.r*1.7,height=o.height*2.1,depth=o.r*1.8;
 if(o.type==='bridge'){
  add(0,5.6,0,15,.65,2.2,'橋の床');
  add(0,6.1,0,15,.22,2.3,'橋の上部');
  for(let side of [-1,1])add(side*6.8,2.8,0,.55,5.6,1.7,'橋の支柱');
  add(0,7.25,0,15,.13,.16,'橋の手すり');
 }else if(o.type==='gate'){
  for(let side of [-1,1])add(side*5,4,0,.9,8,1.3,'ゲートの柱');
  add(0,8,0,11,1.1,1.5,'ゲートの梁');
 }else if(o.type==='tower'){
  add(0,height/2,0,width*.72,height,depth*.72,'タワー');
  for(let j=0;j<4;j++)add(0,height*.25*(j+1),0,width*(1.2-j*.18),.32,depth*(1.2-j*.18),'タワーの張り出し');
  add(0,height+1,0,.18,2,.18,'アンテナ');
 }else{
  add(0,height/2,0,width,height,depth,'ビル');
  add(0,height+.07,0,width+.2,.15,depth+.2,'ビルの屋上');
 }
 const samples=[
  {x:px,y:py,z:pz,label:'機体本体',radiusX:.23,radiusY:.24,radiusZ:.9}
 ];
 // Downsample the drawn shape, but preserve its silhouette and gaps.
 // Unlike the previous version, height and longitudinal distance matter.
 for(let i=0;i<wingHitCells.length;i+=3){
  const c=wingHitCells[i];
  for(const side of [-1,1]){
   samples.push({x:px+side*c.x,y:py,z:pz+c.z,label:side<0?'左翼':'右翼',radiusX:.035,radiusY:.06,radiusZ:.035});
  }
 }
 for(const part of parts){
  for(const q of samples){
   if(Math.abs(q.x-part.cx)>part.w/2+q.radiusX ||
      Math.abs(q.y-part.cy)>part.h/2+q.radiusY ||
      Math.abs(q.z-part.cz)>part.d/2+q.radiusZ)continue;
   const x=clamp(q.x,part.cx-part.w/2,part.cx+part.w/2);
   const y=clamp(q.y,part.cy-part.h/2,part.cy+part.h/2);
   const z=clamp(q.z,part.cz-part.d/2,part.cz+part.d/2);
   return {x,y,z,part:q.label,obstacle:part.label};
  }
 }
 return null;
}
function showImpact(hit){
 if(mode!=='play')return;
 impact=hit;impactTimer=1.05;mode='impact';pauseBtn.style.display='none';
 const markerGeo=new THREE.SphereGeometry(.31,16,12);
 const markerMat=new THREE.MeshBasicMaterial({color:0xff2424,transparent:true,opacity:.95,depthTest:false});
 impactMarker=new THREE.Mesh(markerGeo,markerMat);
 impactMarker.position.set(hit.x,hit.y,hit.z);
 impactMarker.renderOrder=999;scene3.add(impactMarker);
 const toast=document.getElementById('toast');
 toast.style.cssText='position:absolute;z-index:9;bottom:18px;left:50%;transform:translateX(-50%);width:max-content;max-width:92%;background:#641b27ed;color:white;border:2px solid #ff6b6b;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:900;text-align:center;pointer-events:none';
 toast.textContent=`衝突！ ${hit.part} → ${hit.obstacle}`;
 if(speedFX)speedFX.style.opacity='.3';
}
function speedEffects(dt,speed){
 if(!speedCtx)return;
 const c=speedCtx,w=c.canvas.width,h=c.canvas.height;
 c.clearRect(0,0,w,h);
 if(mode!=='play')return;
 fxTick+=dt*speed;
 const cx=w*.5,cy=h*.43;
 c.lineCap='round';
 for(let i=0;i<96;i++){
  let a=i*2.39996,seed=(i*.61803398875)%1;
  let t=(fxTick*(.012+seed*.009)+seed)%1;
  let r=(.1+t*t*1.15)*Math.max(w,h);
  let x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*.72;
  let length=(16+t*95)*(speed/18);
  c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*length,y+Math.sin(a)*length*.72);
  c.strokeStyle=`rgba(224,248,255,${.07+t*.27})`;
  c.lineWidth=.8+t*2.1;c.stroke();
 }
 let gradient=c.createRadialGradient(cx,cy,Math.min(w,h)*.26,cx,cy,Math.max(w,h)*.7);
 gradient.addColorStop(0,'#ffffff00');gradient.addColorStop(1,'#d4f7ff1d');
 c.fillStyle=gradient;c.fillRect(0,0,w,h);
 // Keep the plane and its custom wings readable: no streaks over the aircraft.
 c.save();c.globalCompositeOperation='destination-out';
 const planeX=w*.5+player.x*w*.11,planeY=h*.67+player.y*h*.10;
 const clear=c.createRadialGradient(planeX,planeY,Math.min(w,h)*.11,planeX,planeY,Math.min(w,h)*.38);
 clear.addColorStop(0,'rgba(0,0,0,1)');clear.addColorStop(.55,'rgba(0,0,0,.97)');clear.addColorStop(1,'rgba(0,0,0,0)');
 c.fillStyle=clear;c.fillRect(0,0,w,h);c.restore();
}
function render3D(dt){
 if(!renderer3)return;
 let rr=view.getBoundingClientRect();if(Math.abs(rr.width-W)>1||Math.abs(rr.height-H)>1){W=rr.width;H=rr.height;renderer3.setSize(W,H);camera3.aspect=W/H;camera3.updateProjectionMatrix();if(speedFX){speedFX.width=Math.round(W);speedFX.height=Math.round(H)}}
 if(craft3){trail3.forEach((m,i)=>{m.scale.y=1+Math.sin(performance.now()*.017+i)*.17+Math.min(score/5000,.65);m.material.opacity=.45+Math.sin(performance.now()*.021+i)*.18});craft3.position.set(player.x*1.25,3.4-player.y*1.2,4);craft3.rotation.z=-stickX*.24;craft3.rotation.x=stickY*.08;}
 // True chase camera: directly behind the aircraft, looking toward its nose (-Z).
 camera3.position.set(craft3?craft3.position.x*.38:0,5.15,13.2);camera3.lookAt(craft3?craft3.position.x*.45:0,3,-31);camera3.fov=79+Math.min(score/650,18);camera3.updateProjectionMatrix();
 if(mode==='play')for(let d of roadMarks){d.position.z+=dt*(12+Math.min(score/350,20))*2.7;if(d.position.z>14)d.position.z-=270}
 for(let o of objects){if(o.mesh)o.mesh.position.z=-o.z*2.7}
 if(stageLabel){stageLabel.style.display=(mode==='play'||mode==='impact')?'block':'none';if(stageBannerTimer>0){stageBannerTimer-=dt;stageLabel.style.opacity=String(Math.min(1,stageBannerTimer));}else stageLabel.style.opacity=mode==='play'?'.68':'0';}
 renderer3.render(scene3,camera3);speedEffects(dt,12+Math.min(score/350,20));
}
function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-last)/1000||0,.04);last=now;if(mode==='play'){let kx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),ky=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);let dx=clamp(stickX+kx,-1,1),dy=clamp(stickY+ky,-1,1);player.x=clamp(player.x+dx*dt*wing*2.2,-3.5,3.5);player.y=clamp(player.y+dy*dt*wing*2.2,-2.1,2.1);let speed=12+Math.min(score/350,20);travel+=dt*speed;score+=dt*speed*12;if(scene3)updateStageByScore();scoreEl.textContent='SCORE '+String(Math.floor(score)).padStart(6,'0');speedEl.textContent=`STAGE ${stageIndex+1} · WING ${wing.toFixed(2)}×`;spawn-=dt;if(spawn<=0){spawn=Math.max(.35,1.25-score/6500)*(.7+Math.random()*.55);{let roll=Math.random();let type=roll<.18?'bridge':roll<.34?'gate':roll<.53?'tower':'building';let o={type,x:type==='bridge'||type==='gate'?0:(Math.random()-.5)*8.2,y:-2.9,z:65,r:.75+Math.random()*.75,height:2+Math.random()*4,color:STAGES[Math.max(0,stageIndex)].buildings[Math.floor(Math.random()*3)]};objects.push(o);spawnBuilding3(o)}}for(let o of objects){o.z-=speed*dt;let hit=collision3(o);if(hit){showImpact(hit);break}}objects=objects.filter(o=>{if(o.z>-.5)return true;if(o.mesh){world3.remove(o.mesh);o.mesh.traverse(n=>{if(n.isMesh){n.geometry.dispose();n.material.dispose()}})}return false})}if(mode==='impact'){
 impactTimer-=dt;
 if(impactMarker){
  impactMarker.scale.setScalar(1+Math.sin((1.05-impactTimer)*30)*.32);
  impactMarker.material.opacity=.65+.35*Math.abs(Math.sin((1.05-impactTimer)*16));
 }
 if(impactTimer<=0){finish();document.getElementById('toast').textContent='';document.getElementById('toast').removeAttribute('style');}
 }
 render3D(dt);if(mode==='pause')document.getElementById('toast').textContent='PAUSED';else if(mode!=='impact')document.getElementById('toast').textContent='';}
const stick=document.getElementById('stick'),knob=document.getElementById('knob');function moveStick(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.32;let dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.hypot(dx,dy),f=dist>max?max/dist:1;dx*=f;dy*=f;stickX=dx/max;stickY=dy/max;knob.style.left=`calc(50% + ${dx}px)`;knob.style.top=`calc(50% + ${dy}px)`}function resetStick(){stickX=stickY=0;knob.style.left='50%';knob.style.top='50%'}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);moveStick(e)};stick.onpointermove=e=>{if(stick.hasPointerCapture(e.pointerId))moveStick(e)};stick.onpointerup=stick.onpointercancel=resetStick;addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);pauseBtn.onclick=()=>{if(mode==='play'){mode='pause';pauseBtn.textContent='▶'}else if(mode==='pause'){mode='play';pauseBtn.textContent='Ⅱ';last=performance.now()}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'){mode='pause';pauseBtn.textContent='▶'}});menu();setup3D();requestAnimationFrame(frame);
</script></body></html>
